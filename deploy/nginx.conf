# Configuración de Nginx para HG Jerseys (sitio estático)
# Se instala en /etc/nginx/sites-available/hg-jerseys

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/hg-jerseys;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
